<div id="ov"><h1>APEX RUSH</h1>

addEventListener('error',e=>{const d=document.createElement('div');d.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:9;background:#900;color:#fff;font:12px monospace;padding:6px';d.textContent='Error: '+e.message;document.body.appendChild(d)});

{const dm=new T.Object3D(),col=new T.Color();

const cone=new T.ConeGeometry(3,10,7);cone.translate(0,5,0);

mk(cone,new T.MeshStandardMaterial({roughness:.9}),320,{min:34,range:90,fn:(d,x,z,c)=>{const s=.7+Math.random()*.9;d.position.set(x,0,z);d.scale.set(s,s,s);d.rotation.set(0,Math.random()*6,0);c.setHSL(.3+Math.random()*.05,.55,.07+Math.random()*.05)}});
const bg=new T.BoxGeometry(1,1,1);bg.translate(0,.5,0);
const wt=tex(64,128,(x,w,h)=>{x.fillStyle='#1b2029';x.fillRect(0,0,w,h);for(let i=0;i<8;i++)for(let j=0;j<16;j++){x.fillStyle=Math.random()<.4?'#ffd88a':'#2c3442';x.fillRect(i*8+1,j*8+1,5,5)}});
mk(bg,new T.MeshStandardMaterial({map:wt,emissiveMap:wt,emissive:0xffffff,emissiveIntensity:.35,roughness:.5,metalness:.3}),110,{min:110,range:130,fn:(d,x,z,c)=>{d.position.set(x,0,z);d.rotation.set(0,Math.random()*3,0);d.scale.set(18+Math.random()*25,25+Math.random()*90,18+Math.random()*25);c.setHex(0xffffff)}});}
// ---- Cars
function makeCar(col){const g=new T.Group(),b=new T.Group();g.add(b);
const paint=new T.MeshPhysicalMaterial({color:col,metalness:.4,roughness:.3,clearcoat:1,clearcoatRoughness:.04});
const dark=new T.MeshStandardMaterial({color:0x06070a,metalness:.9,roughness:.12});

bx(2.05,.07,.55,0,1.1,-2.05,paint);bx(.08,.4,.3,.6,.9,-2,dark);bx(.08,.4,.3,-.6,.9,-2,dark);bx(2,.08,.5,0,.28,2.15,dark);

[[1,1.4],[-1,1.4],[1,-1.4],[-1,-1.4]].forEach(([s,z])=>{const w=new T.Group(),t=new T.Mesh(new T.CylinderGeometry(.4,.4,.32,20),wm),r=new T.Mesh(new T.CylinderGeometry(.26,.26,.34,10),rim);t.rotation.z=r.rotation.z=Math.PI/2;t.castShadow=true;w.add(t,r);w.position.set(s*1.0,.4,z);g.add(w);ws.push(w)});

// ---- Loop
let camH=0,last=performance.now(),slow=0;const dm=new T.Vector3(),sp=$('sl'),kmh=$('kmh'),nbi=$('nbi'),tl=$('tl');
function resize(){R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}addEventListener('resize',resize);resize();
function frame(now){requestAnimationFrame(frame);let dt=Math.min(.05,(now-last)/1e3);last=now;
slow=dt>.024?slow+1:Math.max(0,slow-1);if(slow>90){slow=0;if(pr>.6){pr=Math.max(.6,pr-.25);R.setPixelRatio(pr)}else R.shadowMap.enabled=false}
if(state=='count'){cdT-=dt;const n=Math.ceil(cdT);cdEl.textContent=n>0?n:'GO!';if(cdT<=0){state='race';setTimeout(()=>{if(state=='race')cdEl.textContent=''},800)}}
if(state=='race'||state=='done'){raceT+=state=='race'?dt:0;
cars.forEach(c=>{const I=c.ai?aiIn(c):readIn();phys(c,I,dt)});
for(let i=0;i<4;i++)for(let j=i+1;j<4;j++){const a=cars[i],b=cars[j],dx=b.x-a.x,dz=b.z-a.z,d=Math.hypot(dx,dz);if(d<2.6&&d>.01){const p=(2.6-d)/2,nx=dx/d,nz=dz/d;a.x-=nx*p;a.z-=nz*p;b.x+=nx*p;b.z+=nz*p;const rv=(b.vx-a.vx)*nx+(b.vz-a.vz)*nz;if(rv<0){a.vx+=nx*rv*.5;a.vz+=nz*rv*.5;b.vx-=nx*rv*.5;b.vz-=nz*rv*.5}}}
if(state=='race'&&me.lap>=LAPS){state='done';me.ai=true;me.off=0;me.skill=.9;const r=[...cars].sort((a,b)=>b.prog-a.prog).indexOf(me)+1;$('msg').innerHTML=`Finished P${r} of 4<br>Time ${fmt(raceT)}`;$('ov').style.display='flex';$('go').textContent='RACE AGAIN'}}
const rank=[...cars].sort((a,b)=>b.prog-a.prog);
cars.forEach(c=>{const m=c.m,u=m.userData;m.position.set(c.x,0,c.z);m.rotation.y=c.h;u.b.rotation.z=-c.s*.05*Math.min(1,Math.abs(c.vf)/40);u.b.rotation.x=0;c.spin+=c.vf*dt/.4;u.ws.forEach((w,i)=>{w.rotation.x=c.spin;w.children[0].rotation.y=0;if(i<2)w.rotation.y=c.s*.4});
u.tl.emissiveIntensity=c.br?3:.8;u.fl.visible=!!c.nosOn;if(c.nosOn)u.fl.scale.set(1,1.5+Math.random()*1.5,1)});
const fx=Math.sin(me.h),fz=Math.cos(me.h);let d=me.h-camH;d=Math.atan2(Math.sin(d),Math.cos(d));camH+=d*Math.min(1,dt*5);
const sv=Math.abs(me.vf),dist=7.5+sv*.03,cx=Math.sin(camH),cz=Math.cos(camH);
cam.position.lerp(dm.set(me.x-cx*dist,2.6+sv*.01,me.z-cz*dist),Math.min(1,dt*9));cam.lookAt(me.x+fx*9,1.3,me.z+fz*9);
cam.fov+=((60+sv*.3+(me.nosOn?12:0))-cam.fov)*Math.min(1,dt*4);cam.updateProjectionMatrix();
sky.position.copy(cam.position);sun.position.set(me.x+sunDir.x*100,sunDir.y*100,me.z+sunDir.z*100);sun.target.position.set(me.x,0,me.z);
kmh.textContent=Math.round(sv*3.6);nbi.style.width=me.nos*100+'%';sp.style.opacity=Math.min(.9,Math.max(0,(sv-45)/50)+(me.nosOn?.4:0));
tl.innerHTML=`P${rank.indexOf(me)+1}<small>/4 · LAP ${Math.min(LAPS,Math.max(1,me.lap+1))}/${LAPS}</small><small>${fmt(raceT)}</small>`;
if(AC){og.gain.value=state=='menu'?0:.05;osc.frequency.value=48+(sv%24)*5+sv*1.4;flt.frequency.value=500+sv*14}
drawMM();R.render(scene,cam)}
cars.forEach((c,i)=>c.reset(i));camH=me.h;
cam.position.set(me.x-Math.sin(me.h)*9,3,me.z-Math.cos(me.h)*9);
requestAnimationFrame(frame);
</script></body></html>
